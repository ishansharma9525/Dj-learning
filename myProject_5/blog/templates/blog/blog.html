<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>django page</title>
  </head>
  <body>
    <h1>django template Basic</h1>
    {% comment %} single variable {% endcomment %}
     <p>name: {{name}}</p>
     <p>email:{{email}}</p>
     <p>age:{{age}}</p>
     <p>firstSkill: {{skill.0}}</p>
     <p>skill : {{skill}}</p>
     <p>user: {{user}}</p>


  </body>
</html>
